# prismd gateway profile for Codex CLI
# Place at ~/.codex/prismd.config.toml, then run:
#   PRISMD_API_KEY=<local-token> codex --profile prismd
#
# M0 has no alias routing yet: "model" must be one of the ids listed in
# presets/providers.json (e.g. "openrouter/auto"). Aliases (free-auto) land in M1.
model = "openrouter/auto"
model_provider = "prismd"

[model_providers.prismd]
name = "prismd"
base_url = "http://127.0.0.1:8787/v1"
env_key = "PRISMD_API_KEY"
wire_api = "responses"
request_max_retries = 2
stream_max_retries = 1
stream_idle_timeout_ms = 180000
